name: IG - bajar un posteo propio
on:
  workflow_dispatch:
    inputs:
      usuario: {description: "usuario IG", required: true}
      ig: {description: "id IG de la cuenta", required: true}
      codigo: {description: "código del posteo (de la URL)", required: true}
      destino: {description: "carpeta del repo", required: true}
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Bajar
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          METRICAS_USUARIO: ${{ github.event.inputs.usuario }}
          METRICAS_IG: ${{ github.event.inputs.ig }}
        run: |
          cd quinta-ig/metricas && python3 bajar_post.py "${{ github.event.inputs.codigo }}" "$GITHUB_WORKSPACE/${{ github.event.inputs.destino }}"
          cd "$GITHUB_WORKSPACE/${{ github.event.inputs.destino }}"
          for v in *.mp4; do [ -f "$v" ] || continue; mkdir -p cuadros; ffmpeg -nostdin -loglevel error -i "$v" -vf "fps=1/2" -q:v 2 "cuadros/${v%.mp4}-%03d.jpg"; done
      - name: Guardar
        run: |
          git config user.name "robot" && git config user.email "robot@users.noreply.github.com"
          git add -A && git commit -m "Bajado posteo ${{ github.event.inputs.codigo }}" && git pull --rebase -q && git push -q

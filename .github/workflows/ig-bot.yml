name: IG - bot quinta (solo lectura manual; el envío lo hace el reloj)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ig-bot, cancel-in-progress: false }
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography
      - name: Leer pendientes
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python3 quinta-ig/bot/bot.py probar_control 1907332440664902 || true
          python3 quinta-ig/bot/bot.py leer
          echo "Solo diagnóstico: no commitea (el reloj es el único que escribe pendientes)."

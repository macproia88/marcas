name: IG - bot quinta (solo lectura manual; el envío lo hace el reloj)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ig-bot, cancel-in-progress: false }
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography
      - name: Enviar respuestas y leer pendientes
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
                    python3 quinta-ig/bot/bot.py probar_control 1907332440664902 || true
          python3 quinta-ig/bot/bot.py leer
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add quinta-ig/bot/pendientes.enc.json quinta-ig/bot/responder.json 2>/dev/null || true
          git commit -m "Bot quinta: pendientes [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

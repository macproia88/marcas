name: IG - bot quinta
on:
  workflow_dispatch:
  push:
    paths: ['quinta-ig/bot/probar.trigger']
permissions:
  contents: write
concurrency: { group: ig-bot, cancel-in-progress: false }
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar permisos
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python3 quinta-ig/bot/probar.py > /dev/null
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add quinta-ig/bot/prueba.json
          git commit -m "Bot quinta: prueba [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

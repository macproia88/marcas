name: IG - conectar cliente (link) y renovar llaves
# accion=claves  -> crea una sola vez el par de claves de la página de conexión
# accion=conectar -> recibe el "código cifrado" que manda el cliente y guarda su llave cifrada
# accion=renovar -> renueva las llaves de 60 días (también corre solo los lunes)
on:
  workflow_dispatch:
    inputs:
      accion: { description: "claves | conectar | renovar", required: true, default: conectar }
      cliente: { description: "carpeta del cliente (ej. tallerfatima)", required: false, default: "" }
      paquete: { description: "código cifrado que mandó el cliente", required: false, default: "" }
  schedule:
    - cron: '17 12 * * 1'
permissions:
  contents: write
concurrency: { group: ig-conectar, cancel-in-progress: false }
jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography
      - name: Ejecutar
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          ACCION: ${{ github.event.inputs.accion || 'renovar' }}
          CLIENTE: ${{ github.event.inputs.cliente }}
          PAQUETE: ${{ github.event.inputs.paquete }}
        run: |
          echo "::add-mask::$PAQUETE"
          python3 quinta-ig/publicador/conectar.py "$ACCION"
      - name: Guardar
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add conectar/clave-publica.json quinta-ig/publicador/llaves quinta-ig/publicador/cuentas.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "Conexión de cuentas: ${{ github.event.inputs.accion || 'renovar' }} [skip ci]"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi

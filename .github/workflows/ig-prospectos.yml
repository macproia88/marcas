name: IG - prospectos del florido (cifrado)
on:
  workflow_dispatch:
  push:
    paths: ['quinta-ig/prospectos/dms_florido.py']
permissions:
  contents: write
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 quinta-ig/prospectos/dms_florido.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add quinta-ig/prospectos/florido.enc.json; git commit -m "Prospectos florido (cifrado) [skip ci]" || exit 0
          git pull --rebase -X theirs -q && git push -q

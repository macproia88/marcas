name: IG - respondedor rápido de DMs (Quinta El Florido)
# Contesta los mensajes directos al toque con Claude Haiku. Loop de ~5h45m que se relanza solo.
# Los comentarios los sigue haciendo el bot de cada 3 horas.
on:
  workflow_dispatch:
  push:
    paths: ['quinta-ig/bot/rapido.trigger', '.github/workflows/ig-rapido.yml']
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: write
  actions: write
concurrency: { group: ig-rapido, cancel-in-progress: false }
jobs:
  rapido:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography
      - name: Loop
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRECIOS_KEY: ${{ secrets.PRECIOS_KEY }}
        run: |
          set +e
          git config user.name "github-actions"; git config user.email "actions@github.com"
          FIN=$(( $(date +%s) + 345*60 ))
          while [ $(date +%s) -lt $FIN ]; do
            git checkout -q -- . 2>/dev/null; git pull --rebase -X theirs -q || { git rebase --abort; git pull --rebase -X theirs -q; }
            if [ -f quinta-ig/bot/rapido.pausa ]; then sleep 60; continue; fi
            python3 quinta-ig/bot/rapido.py || true
            git add quinta-ig/bot/rapido.log.json 2>/dev/null
            if ! git diff --cached --quiet; then
              git commit -qm "Rápido: DMs [skip ci]"
              for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
            fi
            sleep 60
          done
      - name: Relanzarse
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ig-rapido.yml --ref main || true

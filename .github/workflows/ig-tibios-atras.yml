name: ig-tibios-atras
on: workflow_dispatch
permissions: { contents: write }
jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q cryptography
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRECIOS_KEY: ${{ secrets.PRECIOS_KEY }}
        run: |
          cd quinta-ig/bot && python3 tibios_atras.py
          cd ../.. && git config user.name "github-actions" && git config user.email "actions@github.com"
          git add quinta-ig/bot/tibios.enc.json && git commit -qm "Tibios: carga de los últimos 7 días [skip ci]" && for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; sleep 5; done

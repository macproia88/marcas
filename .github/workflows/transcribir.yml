name: Transcribir video (subtítulos)
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Ruta del video en el repo"
        required: true
      modelo:
        description: "Modelo whisper"
        default: "medium"
permissions:
  contents: write
jobs:
  transcribir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q openai-whisper
      - name: Transcribir
        run: |
          V="${{ github.event.inputs.video }}"
          whisper "$V" --model "${{ github.event.inputs.modelo }}" --language Spanish --task transcribe \
            --word_timestamps True --output_format json --output_dir "$(dirname "$V")"
          python3 - "$V" <<'PY'
          import json,sys,os
          v=sys.argv[1]; j=os.path.splitext(v)[0]+".json"
          d=json.load(open(j))
          for s in d["segments"]: print(round(s["start"],2), round(s["end"],2), s["text"])
          PY
      - name: Guardar
        run: |
          git config user.name "robot" && git config user.email "robot@users.noreply.github.com"
          git add -A && git commit -m "Transcripción de ${{ github.event.inputs.video }}" && git pull --rebase -q && git push -q

name: Voz en off para reels
on:
  workflow_dispatch:
  push:
    paths: ['clientes/*/voz/pedidos.json', 'quinta-ig/voz/pedidos.json', 'herramientas-voz/voz_en_off.py']
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q piper-tts
      - run: |
          mkdir -p voces
          curl -sL -o voces/es_AR-daniela-high.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_AR/daniela/high/es_AR-daniela-high.onnx"
          curl -sL -o voces/es_AR-daniela-high.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_AR/daniela/high/es_AR-daniela-high.onnx.json"
      - run: for f in clientes/*/voz/pedidos.json quinta-ig/voz/pedidos.json; do python3 herramientas-voz/voz_en_off.py "$f"; done
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add clientes/*/videos quinta-ig/videos; git commit -m "Voz en off agregada a reels [skip ci]" || exit 0
          git pull --rebase -X theirs -q && git push -q

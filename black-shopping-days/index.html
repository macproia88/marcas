<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora Black Shopping Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3dfc4;color:#1d1d1b;font-family:Jost,'Helvetica Neue',Arial,sans-serif}
.top{background:#fff;text-align:center;padding:28px 16px 22px}
.titulo{font-weight:700;font-size:40px;letter-spacing:2px;text-transform:uppercase;line-height:1.1}
.sub{margin-top:8px;font-weight:400;font-size:14px;letter-spacing:4px;text-transform:uppercase;color:#5a524a}
.wrap{max-width:1080px;margin:0 auto;padding:32px 18px 28px;display:flex;flex-direction:column;gap:28px}
.form{background:#fff;padding:22px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:center}
.campo{display:flex;flex-direction:column;gap:8px}
.campo label{font-size:13px;font-weight:500;letter-spacing:3px;text-transform:uppercase}
.precio{flex:1 1 260px;max-width:440px}
.caja{display:flex;align-items:center;background:#faf3ea;border:1px solid #1d1d1b;padding:0 16px;height:68px;font-weight:300;font-size:34px}
.caja input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:500 34px Jost,sans-serif;color:#1d1d1b;padding-left:8px}
.pct input{width:120px;height:56px;border:1px solid #1d1d1b;background:#faf3ea;color:#1d1d1b;font:500 24px Jost,sans-serif;text-align:center}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.cards{display:flex;flex-wrap:wrap;gap:18px}
.card{flex:1 1 280px;background:#fff;padding:26px 24px 24px;display:flex;flex-direction:column;gap:10px}
.card.c1{background:#faf3ea}
.card.c3{outline:2px solid #1d1d1b;outline-offset:-2px}
.badge{align-self:flex-start;background:#d6392c;color:#fff;font-weight:500;font-size:15px;letter-spacing:3px;padding:6px 12px;border-radius:6px;text-transform:uppercase}
.badge.lista{background:#c9a57a}
.lleva{font-weight:400;font-size:22px;letter-spacing:3px;text-transform:uppercase;margin-top:6px}
.mini{font-size:12px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#5a524a;margin-top:6px}
.unit{font-weight:700;font-size:46px;line-height:1}
.antes{font-size:15px;font-weight:300;text-decoration:line-through;color:#5a524a;min-height:20px}
.sep{height:1px;background:#e3d3bd;margin:6px 0}
.fila{display:flex;justify-content:space-between;font-size:16px;letter-spacing:1px}
.fila strong{font-weight:700}
.fila.ahorro strong{color:#d6392c}
.pie{text-align:center;font-size:13px;letter-spacing:1px;color:#5a524a;display:flex;flex-direction:column;gap:4px}
</style>
</head>
<body>
<div class="top">
  <div class="titulo">Black Shopping Days</div>
  <div class="sub">Prendas de nueva colección</div>
</div>
<div class="wrap">
  <div class="form">
    <div class="campo precio">
      <label for="precio">Precio de la prenda</label>
      <div class="caja">$<input id="precio" type="number" inputmode="decimal" min="0" placeholder="Ej: 45000" value="45000"></div>
    </div>
    <div class="campo pct"><label for="d2">% x 2</label><input id="d2" type="number" min="0" max="100" value="20"></div>
    <div class="campo pct"><label for="d3">% x 3</label><input id="d3" type="number" min="0" max="100" value="30"></div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="pie">
    <div>No acumulable con otras promociones u ofertas puntuales.</div>
    <div>Última actualización: 27/11/2026 11:10</div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => '$' + Math.round(n).toLocaleString('es-AR');
const clamp = (v) => Math.min(100, Math.max(0, parseFloat(v) || 0));
function card(n, d, cls, p) {
  const unit = p * (1 - d / 100);
  return '<div class="card ' + cls + '">' +
    '<span class="badge' + (d > 0 ? '' : ' lista') + '">' + (d > 0 ? d + '% OFF' : 'Precio lista') + '</span>' +
    '<div class="lleva">Llevando ' + n + '</div>' +
    '<div class="mini">Cada prenda te queda</div>' +
    '<div class="unit">' + fmt(unit) + '</div>' +
    '<div class="antes">' + (d > 0 ? 'Antes ' + fmt(p) + ' c/u' : '') + '</div>' +
    '<div class="sep"></div>' +
    '<div class="fila"><span>Total</span><strong>' + fmt(unit * n) + '</strong></div>' +
    '<div class="fila ahorro"><span>Te ahorrás</span><strong>' + fmt((p - unit) * n) + '</strong></div>' +
    '</div>';
}
function calc() {
  const p = parseFloat($('precio').value) || 0;
  $('cards').innerHTML = card(1, 0, 'c1', p) + card(2, clamp($('d2').value), 'c2', p) + card(3, clamp($('d3').value), 'c3', p);
}
['precio', 'd2', 'd3'].forEach((id) => $(id).addEventListener('input', calc));
calc();
</script>
</body>
</html>

<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quinta El Florido · Lo que sabe el bot</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#faf7f5;color:#222}header{background:#b71c1c;color:#fff;padding:16px}h1{margin:0;font-size:20px}
main{max-width:900px;margin:auto;padding:12px}h2{color:#b71c1c;font-size:17px;margin:22px 0 8px}table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
td,th{border:1px solid #e5d8d4;padding:6px 8px;text-align:left;vertical-align:top}th{background:#fbe9e7}.falta{color:#c62828;font-weight:600}
.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px}.d{background:#fff;border:1px solid #eee;min-height:40px;font-size:12px;padding:3px;border-radius:4px}
.d.oc{background:#ffcdd2}.d b{display:block}.nom{font-weight:700;margin:6px 0}footer{font-size:12px;color:#777;padding:16px;text-align:center}footer a{color:#b71c1c;margin:0 6px}</style></head>
<body><header><h1>Quinta El Florido · Lo que sabe el bot</h1><div id="act"></div></header><main>
<h2>Calendario (próximos 3 meses)</h2><div id="cal"></div><p style="font-size:12px">En rojo: ocupado (D = quinta de día, C = casa).</p>
<h2>Precios</h2><table id="pre"></table><h2>Comodidades</h2><table id="com"></table><h2>Reglas</h2><table id="reg"></table><h2>Fotos</h2><div id="fot"></div></main>
<footer>Actualizado: <span id="act2"></span><br><a href="../../c/florido-b02e6312/">Informe de la quinta</a><a href="../../tablero-quinta.html">Tablero</a><a href="../../c/demo-quintas/">Demo para clientes</a></footer>
<script>
const f=s=>s.includes('[COMPLETAR')?`<span class="falta">${s}</span>`:s;
fetch('quinta.json?'+Date.now()).then(r=>r.json()).then(d=>{
document.getElementById('act').textContent='Última actualización: '+d.actualizado;document.getElementById('act2').textContent=d.actualizado;
const oc={};d.calendario.forEach(c=>{(oc[c.fecha]=oc[c.fecha]||[]).push(c.quinta=='dia'?'D':'C')});
let h='';const hoy=new Date();for(let m=0;m<3;m++){const p=new Date(hoy.getFullYear(),hoy.getMonth()+m,1);
h+=`<div class="nom">${p.toLocaleDateString('es-AR',{month:'long',year:'numeric'})}</div><div class="mes">`+'LMMJVSD'.split('').map(x=>`<div style="text-align:center;font-size:11px">${x}</div>`).join('');
for(let i=0;i<(p.getDay()+6)%7;i++)h+='<div></div>';const n=new Date(p.getFullYear(),p.getMonth()+1,0).getDate();
for(let i=1;i<=n;i++){const k=`${p.getFullYear()}-${String(p.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;h+=`<div class="d ${oc[k]?'oc':''}"><b>${i}</b>${(oc[k]||[]).join(' ')}</div>`}h+='</div>'}
document.getElementById('cal').innerHTML=h;
document.getElementById('pre').innerHTML='<tr><th>Qué</th><th>Precio</th><th>¿Lo dice el bot?</th></tr>'+d.precios.map(p=>`<tr><td>${p.que}${p.nota?'<br><small>'+f(p.nota)+'</small>':''}</td><td>${f(p.precio)}</td><td>${p.bot_lo_dice?'Sí':'No'}</td></tr>`).join('');
document.getElementById('com').innerHTML='<tr><th>Qué</th><th>Quinta de día</th><th>Casa</th></tr>'+d.comodidades.map(c=>`<tr><td>${c.que}${c.detalle?'<br><small>'+f(c.detalle)+'</small>':''}</td><td>${f(c.dia)}</td><td>${f(c.casa)}</td></tr>`).join('');
document.getElementById('reg').innerHTML=d.reglas.map(r=>`<tr><th>${r.tema}</th><td>${f(r.regla)}</td></tr>`).join('');
document.getElementById('fot').innerHTML=d.fotos.map(x=>`<a href="${x.link}"><img src="${x.link}" alt="${x.que}" style="width:31%;margin:1%;border-radius:6px"></a>`).join('')})
</script></body></html>
